[registry]
name = "5TRATA"
version = "1.1"
status = "active"
updated_on = "2026-10-10"

[eor]
name = "EOR"
types = ["Entity", "Operation", "Resource"]
class_count = 6
classes_per_type = 2

[eor.entity]
classes = ["Agent", "Sidekik"]

[eor.operation]
classes = ["Station", "Service"]

[eor.resource]
classes = ["Base", "Model"]

[eor.class.Agent]
kind = "standard_top_level_harness"

[eor.class.Sidekik]
kind = "higher_access_top_level_harness"
mission = "continuity"
first = "Raven"

[eor.class.Station]
kind = "operation"
owners = ["Agent", "Sidekik"]

[eor.class.Service]
kind = "operation"
owners = ["Agent", "Sidekik"]

[eor.class.Base]
kind = "location_of_work"

[eor.class.Model]
kind = "llm_assigned_to_mesh_port"

[layer0]
name = "CMD"
spec = "L0.CMD.SPECIFICATION.md"
checklist = "L0.CMD.CHECKLIST.md"
lock_script = "/root/!ZENS3N.CMD/_TRON/systemd/service/5trata/layer-0/layer0_lock.sh"
state_file = "/root/!ZENS3N.CMD/_TRON/systemd/service/5trata/LAYER.TRACK/layer0/state/layer0.state.json"
receipts_file = "/root/!ZENS3N.CMD/_TRON/systemd/service/5trata/LAYER.TRACK/layer0/receipts/layer0.receipts.jsonl"

[roots]
wsl_tron = "/root/!ZENS3N.CMD/_TRON"
central_tron = "/mnt/v/!CENTRAL.CMD/_TRON"
relay = "/mnt/r/!CMD.RELAY"

[identifiers]
cmd_relay_id = "/mnt/r/!CMD.RELAY/CMD.RELAY.ID"
cmd_bridge_id = "/mnt/r/!CMD.RELAY/!CMD.BRIDGE/CMD.BRIDGE.ID"
cmd_center_id = "/mnt/r/!CMD.RELAY/!CMD.CENTER/CMD.CENTER.ID"
hub_id = "/mnt/r/!CMD.HUB/HUB.ID"
