<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>zensen.systems :: educate</title>
  <style>:root{color-scheme:dark;--bg:#070a0d;--panel:#10161b;--line:#27343d;--text:#edf5f4;--muted:#9aaeb2;--mint:#75e0c4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
main{max-width:920px;margin:auto;padding:28px 22px 64px}a{color:var(--mint)}
header,section,footer{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:14px;padding:22px;margin:16px 0}
.eyebrow{color:var(--mint);font:12px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(36px,7vw,64px);line-height:.95;margin:12px 0 16px;letter-spacing:-.04em}
h2{margin:0 0 12px;font-size:1.2rem}p,li{color:var(--muted);max-width:68ch}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-block;padding:10px 16px;border:1px solid var(--mint);border-radius:8px;text-decoration:none;color:var(--bg);background:var(--mint);font-weight:600}
.btn.ghost{background:transparent;color:var(--mint)}
.rail{font:13px ui-monospace,monospace;color:var(--mint)}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
form{display:grid;gap:10px;max-width:28rem}label{font-size:13px;color:var(--muted)}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1014;color:var(--text)}
button{padding:10px 16px;border-radius:8px;border:0;background:var(--mint);color:#04110d;font-weight:700;cursor:pointer}
footer{font-size:13px;color:var(--muted)}</style>
  <script src="/surface.js" defer></script>
</head>
<body><main>

  </header>
  
  <footer>ZENSEN Systems · staging · <a href="/healthz">healthz</a> · <a data-link="home" href="http://127.0.0.1:7120/">suite home</a></footer>

</html>
