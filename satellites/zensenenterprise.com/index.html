  <title>zensenenterprise.com :: under construction</title>
  <style>
    :root { color-scheme: dark; --black:#020304; --white:#f4f7f8; --muted:#929ca6; --brand:#ee7a0c; --lime:#c6ff00; }

    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--white); background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(238,122,12,.12),transparent 65%),var(--black); font:14px/1.6 'DM Mono',ui-monospace,monospace; }
    main { width:min(680px,100%); padding:clamp(28px,7vw,72px); border:1px solid rgba(255,255,255,.14); border-radius:16px; background:rgba(8,10,13,.86); box-shadow:0 24px 80px rgba(0,0,0,.35); }
    .eyebrow { color:var(--brand); font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:18px 0 10px; font:800 clamp(2.2rem,8vw,4.2rem)/.95 'Oxanium',system-ui,sans-serif; letter-spacing:-.04em; }
    p { max-width:40em; color:var(--muted); }
    .state { margin-top:16px; color:var(--brand); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; }
    a { display:inline-block; margin-top:20px; color:var(--lime); text-decoration:none; border-bottom:1px solid currentColor; }
    a:focus-visible { outline:2px solid var(--brand); outline-offset:4px; }
  </style>
</head>
