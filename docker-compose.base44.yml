services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./!WORKDESK/Websites/zensensystems:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
