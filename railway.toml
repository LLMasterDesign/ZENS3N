[build]
builder = "railpack"

[deploy]
startCommand = "python3 !WORKDESK/Projects/Atlas/sites/zensen/deploy/serve-local.py --directory !WORKDESK/Websites/zensensystems --host 0.0.0.0 --port $PORT"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
